name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [android-development]
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', 'settings.gradle.kts', '.github/workflows/build-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Optional Firebase configuration
        env:
          FIREBASE_JSON_BASE64: ${{ secrets.FIREBASE_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_JSON_BASE64" ]; then
            echo "$FIREBASE_JSON_BASE64" | base64 -d > app/google-services.json
          fi
      - name: Restore permanent signing key
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$ANDROID_SIGNING_KEY" ] || [ -z "$ANDROID_SIGNING_PASSWORD" ]; then
            echo "::error::Configure GitHub Actions secrets ANDROID_SIGNING_KEY and ANDROID_SIGNING_PASSWORD"
            exit 1
          fi
          printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/smsbridge-signing.p12"
          chmod 600 "$RUNNER_TEMP/smsbridge-signing.p12"
      - name: Build signed release APK
        env:
          BRIDGE_SERVER_URL: ${{ vars.BRIDGE_SERVER_URL }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/smsbridge-signing.p12
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon -PBRIDGE_SERVER_URL="$BRIDGE_SERVER_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: SMSBridge-release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
