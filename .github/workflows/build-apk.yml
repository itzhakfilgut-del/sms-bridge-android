name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [android-development]
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', 'settings.gradle.kts', '.github/workflows/build-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Optional Firebase configuration
        env:
          FIREBASE_JSON_BASE64: ${{ secrets.FIREBASE_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_JSON_BASE64" ]; then
            echo "$FIREBASE_JSON_BASE64" | base64 -d > app/google-services.json
          fi
      - name: Build debug APK
        env:
          BRIDGE_SERVER_URL: ${{ vars.BRIDGE_SERVER_URL }}
        run: gradle :app:assembleDebug --no-daemon -PBRIDGE_SERVER_URL="$BRIDGE_SERVER_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: SMSBridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
